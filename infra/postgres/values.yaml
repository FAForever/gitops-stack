image:
  repository: "postgres"
  tag: "17.9-bookworm"

upgrade-image:
  repository: "pgautoupgrade/pgautoupgrade"
  tag: "17-bookworm"

infisical-secret:
  name: postgres

databasesAndUsers:
  # Message Broker Database
  - configMapRef: faf-message-broker
    secretRef: faf-message-broker
    databaseKey: DATABASE_NAME
    usernameKey: DATABASE_USER
    passwordKey: DATABASE_PASSWORD

  # Others
  - configMapRef: wikijs
    secretRef: wikijs
    databaseKey: DB_NAME
    usernameKey: DB_USER
    passwordKey: DB_PASS

  - configMapRef: ory-hydra
    secretRef: ory-hydra
    databaseKey: DB_NAME
    usernameKey: DB_USER
    passwordKey: DB_PASSWORD

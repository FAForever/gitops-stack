 apiVersion: apps/v1
kind: Deployment
metadata:
  name: faf-game-service
  labels:
    app: faf-game-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: faf-game-service
  template:
    metadata:
      labels:
        app: faf-game-service
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9000'
        prometheus.io/path: '/q/metrics'
    spec:
      containers:
        - image: faforever/faf-game-service:1.0.0
          imagePullPolicy: Always
          name: faf-game-service
          envFrom:
            - configMapRef:
                name: faf-game-service
            - secretRef:
                name: faf-game-service
          resources:
            limits:
              memory: 2Gi
            requests:
              memory: 250Mi
          ports:
            - containerPort: 9000
          startupProbe:
            httpGet:
              port: 9000
              path: /q/health
            failureThreshold: 10
            periodSeconds: 3
          livenessProbe:
            httpGet:
              port: 9000
              path: /q/health
            failureThreshold: 3
            periodSeconds: 10
      restartPolicy: Always
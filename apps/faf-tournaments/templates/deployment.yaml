apiVersion: apps/v1
kind: Deployment
metadata:
  name: faf-tournaments
  labels:
    app: faf-tournaments
  annotations:
    reloader.stakater.com/auto: "true"
    # Pushing to main in FAForever/faf-tournaments is the release: the image is
    # republished as `latest`, and Keel rolls it out. Polled every two minutes
    # rather than hourly, because tournaments run live and a fix cannot wait.
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"
spec:
  replicas: 1
  revisionHistoryLimit: 10
  # One db.json on one volume: the old pod has to be gone before the new one
  # starts, or both would write the same file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: faf-tournaments
  template:
    metadata:
      labels:
        app: faf-tournaments
    spec:
      # The image runs as the unprivileged `node` user (uid 1000), and a local
      # volume keeps whatever owner its directory was created with.
      initContainers:
        - name: data-owner
          image: busybox:1.37
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - image: faforever/faf-tournaments:latest
          imagePullPolicy: Always
          name: faf-tournaments
          envFrom:
            - configMapRef:
                name: faf-tournaments
            - secretRef:
                name: faf-tournaments
          ports:
            - containerPort: 8090
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: faf-tournaments-pvc
      restartPolicy: Always
